name: Release CS-90

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CS90.sln

      - name: Publish (win-x64, self-contained, single file)
        run: >
          dotnet publish src/CS90/CS90.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item README.md publish/README.md
          Compress-Archive -Path publish/* -DestinationPath "artifacts/CS90-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/CS90-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
